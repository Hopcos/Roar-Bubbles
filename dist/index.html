<!doctype html>
<html lang="zh-CN">
<head>
  <!-- RoarBubbles v1.0.0 | MIT License | single-file build -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5aa7e0">
  <meta name="description" content="RoarBubbles - 用声音吹出 3D 泡泡的闯关游戏 / Blow 3D bubbles with your voice">
  <title>吼吼泡泡 · RoarBubbles</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='30' cy='30' r='24' fill='%23bfe9ff' stroke='%23ff6fa8' stroke-width='4'/%3E%3Ccircle cx='22' cy='22' r='6' fill='white'/%3E%3C/svg%3E">
  <style>
/* css/style.css */
:root {
  --bg: #0f1a2b;
  --panel: rgba(255, 255, 255, 0.78);
  --panel-border: rgba(255, 255, 255, 0.9);
  --text: #1d2a3a;
  --muted: #5b6b80;
  --accent: #ff6fa8;
  --accent-2: #5fd7ff;
  --ok: #2bb673;
  --warn: #ff5a4d;
  --shadow: 0 8px 30px rgba(10, 30, 60, 0.18);
  --radius: 14px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --panel: rgba(22, 30, 46, 0.78);
    --panel-border: rgba(255, 255, 255, 0.12);
    --text: #e8eef7;
    --muted: #9fb0c6;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

#stage { position: fixed; inset: 0; }
.scene-canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.scene-canvas:active { cursor: grabbing; }

/* ---------- top bar ---------- */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 8px) calc(var(--gutter) + var(--lang-w) + 8px) 8px var(--gutter);
  pointer-events: none;
}
#topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 18px;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 999px; padding: 6px 14px; box-shadow: var(--shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.logo { font-size: 20px; }
.level-label-wrap { flex: 1; min-width: 0; }
.level-label { display: inline-block; max-width: 100%; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 999px; padding: 8px 14px; box-shadow: var(--shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.level-label:empty { display: none; }
.actions { display: flex; gap: 6px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--panel-border);
  background: var(--panel); box-shadow: var(--shadow); font-size: 18px; line-height: 1;
  display: grid; place-items: center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: transform 0.15s;
}
.icon-btn:hover { transform: translateY(-1px) scale(1.05); }

/* ---------- language switch (outermost layer: stays usable above overlays and modals) ---------- */
:root { --lang-w: 104px; }
.lang-switch {
  position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 8px); right: var(--gutter);
  width: var(--lang-w); height: 40px; padding: 3px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 999px; box-shadow: var(--shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.lang-switch button {
  border: 0; border-radius: 999px; background: transparent; color: inherit; opacity: 0.65; padding: 0; white-space: nowrap;
  font-size: 13px; font-weight: 800; cursor: pointer; transition: background 0.15s, opacity 0.15s;
}
.lang-switch button:hover { opacity: 1; }
.lang-switch button[aria-pressed="true"] { background: var(--accent); color: #fff; opacity: 1; }

/* ---------- HUD ---------- */
.panel {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius);
  box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.hud { position: fixed; z-index: 4; padding: 10px 12px; font-size: 13px; pointer-events: none; }
#hud-left { left: var(--gutter); top: calc(env(safe-area-inset-top) + 64px); width: 220px; }
#hud-right { right: var(--gutter); top: calc(env(safe-area-inset-top) + 64px); width: 250px; }
.meter { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; margin: 5px 0; }
.meter label { color: var(--muted); font-weight: 600; }
.bpm { font-size: 11px; color: var(--muted); min-width: 0; }
.bar { height: 9px; border-radius: 99px; background: rgba(120, 140, 170, 0.22); overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; width: 0; border-radius: inherit; transition: width 0.08s linear; }
.c-volume { background: linear-gradient(90deg, #5fd7ff, #3a8dff); }
.c-continuity { background: linear-gradient(90deg, #b07cff, #7a4dff); }
.c-rhythm { background: linear-gradient(90deg, #6fe39a, #2bb673); }
.c-stress { background: linear-gradient(90deg, #ffd34d, #ff5a4d); }
.bar.hold { height: 12px; margin-top: 4px; }
#hold-bar { background: linear-gradient(90deg, #ffd34d, #2bb673); }

.goal-head { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 6px; }
.time { font-variant-numeric: tabular-nums; }
.time.warn { color: var(--warn); animation: pulse 0.8s infinite; }
.goal-row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 3px; gap: 8px; }
.val { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.chk::before { content: '○ '; color: var(--muted); }
.chk.ok::before { content: '✔ '; color: var(--ok); }
.chk.ok { color: var(--ok); font-weight: 700; }
.size-track { position: relative; height: 14px; border-radius: 99px; background: rgba(120, 140, 170, 0.22); }
.size-track .band { position: absolute; top: 0; bottom: 0; background: rgba(43, 182, 115, 0.55); border-radius: 4px; }
.size-track .burst { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--warn); border-radius: 2px; }
.size-track .marker { position: absolute; top: -4px; width: 6px; height: 22px; margin-left: -3px; border-radius: 3px;
  background: var(--accent); box-shadow: 0 0 0 2px #fff; transition: left 0.08s linear; }

.hint {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 18px);
  max-width: calc(100% - 2 * var(--gutter)); text-align: center;
  background: var(--panel); border: 1px solid var(--panel-border); box-shadow: var(--shadow);
  padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.flash {
  position: fixed; z-index: 6; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0.6);
  font-size: 64px; font-weight: 900; color: #fff; opacity: 0; pointer-events: none;
  text-shadow: 0 4px 24px rgba(255, 111, 168, 0.8);
}
.flash.show { animation: flash 1s ease-out; }
@keyframes flash { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); } }
@keyframes pulse { 50% { opacity: 0.45; } }

.fatal { position: fixed; z-index: 20; left: var(--gutter); right: var(--gutter); top: 40%; padding: 16px;
  background: #fff1f0; color: #a8071a; border-radius: var(--radius); text-align: center; box-shadow: var(--shadow); }

/* ---------- overlays / modals ---------- */
.overlay, .modal {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: var(--gutter);
  background: rgba(10, 20, 40, 0.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.modal { z-index: 12; }
/* keep cards clear of the always-on-top language switch */
.overlay, .modal { padding-top: calc(env(safe-area-inset-top) + 56px); }
.card {
  position: relative; width: min(440px, 100%); max-height: calc(100vh - 2 * var(--gutter)); overflow: auto;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 20px; box-shadow: var(--shadow);
  padding: 22px 22px 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  animation: pop 0.25s ease-out;
}
.card.wide { width: min(720px, 100%); }
/* inside an overlay/modal the card must fit below the language-switch clearance,
   otherwise centering pushes its top (and the close button) underneath the switch */
.overlay > .card, .modal > .card {
  max-height: calc(100vh - env(safe-area-inset-top) - 56px - var(--gutter) - env(safe-area-inset-bottom));
  max-height: calc(100dvh - env(safe-area-inset-top) - 56px - var(--gutter) - env(safe-area-inset-bottom));
}
@keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: none; opacity: 1; } }
.card h2 { margin: 0 0 8px; font-size: 22px; }
.close { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(120, 140, 170, 0.18); }
.difficulty { color: #f5a623; letter-spacing: 2px; margin-bottom: 8px; }
.goals { padding-left: 0; list-style: none; margin: 10px 0 18px; line-height: 1.9; }
.card button:not(.close):not(.level-btn) {
  border: 1px solid rgba(120, 140, 170, 0.35); background: rgba(255, 255, 255, 0.6); border-radius: 12px; padding: 10px 16px; font-weight: 700;
}
@media (prefers-color-scheme: dark) { .card button:not(.close):not(.level-btn) { background: rgba(255, 255, 255, 0.08); } }
.card button.primary { width: 100%; border: 0 !important; color: #fff; background: linear-gradient(90deg, #ff6fa8, #b07cff) !important; font-size: 17px; padding: 13px 16px !important; box-shadow: 0 6px 18px rgba(255, 111, 168, 0.4); }
.card button:disabled { opacity: 0.55; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > button { flex: 1 1 auto; }
.row > button.primary { width: auto; }
.countdown { margin-top: 12px; text-align: center; font-weight: 700; color: var(--muted); min-height: 1.2em; }
.error { margin-top: 10px; color: var(--warn); font-weight: 600; }
.stars { font-size: 40px; color: #f5a623; letter-spacing: 6px; text-align: center; }
#overlay-result.win h2 { color: var(--ok); text-align: center; }
#overlay-result.lose h2 { color: var(--warn); text-align: center; }
#result-msg { text-align: center; }
.muted { color: var(--muted); margin-top: 8px; min-height: 1em; }

.guide h3 { margin: 16px 0 6px; font-size: 16px; }
.guide ul { margin: 0; padding-left: 20px; line-height: 1.7; }
.guide p { margin: 0; line-height: 1.7; }

.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-top: 12px; }
.level-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
  padding: 10px; border-radius: 14px; border: 2px solid transparent; color: #1d2a3a;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12); transition: transform 0.12s;
}
.level-btn:not(:disabled):hover { transform: translateY(-2px); }
.level-btn.current { border-color: var(--accent); }
.level-btn:disabled { filter: grayscale(0.9); opacity: 0.6; cursor: not-allowed; }
.level-btn .num { font-size: 22px; font-weight: 900; }
.level-btn .nm { font-size: 12px; font-weight: 600; }
.level-btn .st { color: #e8920c; font-size: 14px; }
.level-btn .st i { font-style: normal; opacity: 0.4; }
.theme-meadow { background: linear-gradient(135deg, #d9f7c8, #9fdc86); }
.theme-lake { background: linear-gradient(135deg, #d5f0ff, #8fd0f2); }
.theme-desert { background: linear-gradient(135deg, #fff0cf, #f3c97c); }
.theme-snow { background: linear-gradient(135deg, #ffffff, #d6e4f2); }
.theme-volcano { background: linear-gradient(135deg, #ffd0b8, #ff8a5c); }

.setting { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 12px 0 16px; font-weight: 600; }
.setting input { width: 100%; accent-color: var(--accent); }

/* ---------- small screens ---------- */
@media (max-width: 720px) {
  :root { --gutter: 10px; }
  .brand-name { display: none; }
  .brand { padding: 6px 10px; }
  .icon-btn { width: 36px; height: 36px; font-size: 16px; }
  :root { --lang-w: 88px; }
  .lang-switch { height: 36px; }
  .lang-switch button { font-size: 12px; }
  .actions { gap: 4px; }
  /* no room for the level label next to the icons: hide it on mobile (the briefing card shows the level) */
  .level-label-wrap { display: none; }
  .actions { margin-left: auto; }
  #topbar { flex-wrap: wrap; }
  .hud { top: auto !important; font-size: 11px; padding: 8px 10px; }
  #hud-left { left: var(--gutter); bottom: calc(env(safe-area-inset-bottom) + 64px); width: calc(50% - var(--gutter) - 4px); }
  #hud-right { right: var(--gutter); bottom: calc(env(safe-area-inset-bottom) + 64px); width: calc(50% - var(--gutter) - 4px); }
  .meter { grid-template-columns: 36px 1fr; gap: 6px; margin: 3px 0; }
  .bpm { display: none; }
  .hint { font-size: 12px; padding: 8px 14px; border-radius: 14px; }
  .flash { font-size: 48px; }
}
@media (max-width: 380px) {
  .icon-btn { width: 32px; height: 32px; font-size: 14px; }
  :root { --lang-w: 80px; }
  .lang-switch { height: 32px; }
}

</style>
</head>
<body>
  <div id="stage" aria-label="3D scene"></div>

  <header id="topbar">
    <div class="brand"><span class="logo">🫧</span><span class="brand-name" data-i18n="title">吼吼泡泡</span></div>
    <div class="level-label-wrap"><span id="level-label" class="level-label"></span></div>
    <nav class="actions">
      <button id="btn-guide" class="icon-btn" data-i18n-title="guide">📖</button>
      <button id="btn-levels" class="icon-btn" data-i18n-title="levels">🗺️</button>
      <button id="btn-settings" class="icon-btn" data-i18n-title="settings">⚙️</button>
      <button id="btn-sound" class="icon-btn">🔊</button>
      <button id="btn-view" class="icon-btn" data-i18n-title="reset_view">⟲</button>
    </nav>
  </header>

  <!-- language switch: on the outermost layer, above every overlay / modal -->
  <div id="lang-switch" class="lang-switch" role="group" aria-label="语言 / Language">
    <button type="button" data-lang="zh" lang="zh-CN" aria-pressed="true">中文</button>
    <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
  </div>

  <section id="hud-left" class="panel hud">
    <div class="meter"><label data-i18n="meter_volume">音量</label><div class="bar"><i id="m-volume" class="c-volume"></i></div></div>
    <div class="meter"><label data-i18n="meter_continuity">连续</label><div class="bar"><i id="m-continuity" class="c-continuity"></i></div></div>
    <div class="meter"><label data-i18n="meter_rhythm">节奏</label><div class="bar"><i id="m-rhythm" class="c-rhythm"></i></div><span id="m-bpm" class="bpm"></span></div>
    <div class="meter"><label data-i18n="meter_stress">压力</label><div class="bar"><i id="m-stress" class="c-stress"></i></div></div>
  </section>

  <section id="hud-right" class="panel hud">
    <div class="goal-head"><span data-i18n="goal">过关目标</span><span id="time-value" class="time">--</span></div>
    <div class="goal-row">
      <span id="chk-size" class="chk" data-i18n="goal_size">泡泡大小</span>
      <span id="size-value" class="val"></span>
    </div>
    <div class="size-track" aria-hidden="true">
      <div id="size-band" class="band"></div>
      <div id="size-burst" class="burst"></div>
      <div id="size-marker" class="marker"></div>
    </div>
    <div class="goal-row"><span id="chk-zone" class="chk" data-i18n="goal_zone">目标区域</span></div>
    <div class="goal-row"><span data-i18n="goal_hold">保持</span><span id="hold-value" class="val"></span></div>
    <div class="bar hold"><i id="hold-bar"></i></div>
  </section>

  <div id="hint" class="hint" role="status" aria-live="polite"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>
  <div id="fatal" class="fatal" hidden></div>

  <!-- level briefing -->
  <div id="overlay-brief" class="overlay">
    <div class="card">
      <h2 id="brief-title"></h2>
      <div id="brief-difficulty" class="difficulty"></div>
      <ul id="brief-goals" class="goals"></ul>
      <button id="btn-start" class="primary" data-i18n="start">开始吹泡泡</button>
      <div id="brief-countdown" class="countdown"></div>
      <div id="brief-error" class="error" role="alert"></div>
    </div>
  </div>

  <!-- result -->
  <div id="overlay-result" class="overlay" hidden>
    <div class="card">
      <h2 id="result-title"></h2>
      <div id="result-stars" class="stars"></div>
      <p id="result-msg"></p>
      <div class="row">
        <button id="btn-retry" data-i18n="retry">再试一次</button>
        <button id="btn-menu" data-i18n="menu">选择关卡</button>
        <button id="btn-next" class="primary" data-i18n="next">下一关</button>
      </div>
    </div>
  </div>

  <!-- guide -->
  <div id="modal-guide" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="guide-title">
    <div class="card wide">
      <button class="close" data-close="modal-guide" data-i18n-title="close">✕</button>
      <h2 id="guide-title" data-i18n="guide">操作指引</h2>
      <div id="guide-body" class="guide"></div>
    </div>
  </div>

  <!-- level select -->
  <div id="modal-levels" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="levels-title">
    <div class="card wide">
      <button class="close" data-close="modal-levels" data-i18n-title="close">✕</button>
      <h2 id="levels-title" data-i18n="levels">关卡</h2>
      <div id="level-grid" class="level-grid"></div>
    </div>
  </div>

  <!-- settings -->
  <div id="modal-settings" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="card">
      <button class="close" data-close="modal-settings" data-i18n-title="close">✕</button>
      <h2 id="settings-title" data-i18n="settings">设置</h2>
      <label class="setting"><span data-i18n="sensitivity">麦克风灵敏度</span>
        <input id="in-sensitivity" type="range" min="0.5" max="3" step="0.1"><output id="out-sensitivity"></output></label>
      <label class="setting"><span data-i18n="sfx_volume">音效音量</span>
        <input id="in-volume" type="range" min="0" max="1" step="0.05"></label>
      <button id="btn-reset-progress" data-i18n="reset_progress">重置关卡进度</button>
      <div id="reset-msg" class="muted"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
/* js/config.js */
/**
 * RoarBubbles - global tuning constants.
 * All gameplay numbers live here so the game can be re-balanced without touching logic.
 */
(function (root, name, deps, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory.apply(null, deps.map(function (d) { return require('./' + d); }));
  } else {
    var ns = (root.RB = root.RB || {});
    ns[name] = factory.apply(null, deps.map(function (d) { return ns[d]; }));
  }
})(typeof self !== 'undefined' ? self : this, 'config', [], function () {
  'use strict';

  var config = {
    version: '1.0.0',

    /** Playable arena: x ∈ [-halfWidth, halfWidth], y ∈ [0, height], z ∈ [-halfDepth, halfDepth] */
    arena: { halfWidth: 6, height: 8, halfDepth: 6 },

    /** Where the bubble wand sits. */
    spawn: { x: 0, y: 1.6, z: 3 },

    audio: {
      fftSize: 1024,
      /** dB above the adaptive noise floor that maps to volume 0 */
      floorMargin: 6,
      /** dB span (above floor + margin) that maps to volume 0 → 1 */
      dynamicRange: 40,
      /** noise floor assumed before any ambient measurement (dB) */
      initialFloorDb: -60,
      /** fast floor adaptation time constant while calibrating on ambient sound (s) */
      calibrateTau: 0.25,
      /** absolute floor bounds for the adaptive noise floor */
      minFloorDb: -90,
      maxFloorDb: -25,
      /** how fast the noise floor creeps upward (dB / s) when the signal is above it */
      floorRiseRate: 0.6,
      /** noise tracking on quiet frames: time constants (s) when the level falls / follows */
      floorFallTau: 0.15,
      floorTrackTau: 6,
      /** noise fluctuation (mean |dB - floor|) estimate: start value and time constant */
      initialNoiseDev: 1,
      noiseDevTau: 2,
      /** gate = floorMargin + clamp(noiseDevFactor * noiseDev - noiseDevAllowance, 0, maxNoiseMargin) */
      noiseDevFactor: 2.5,
      noiseDevAllowance: 2.5,
      maxNoiseMargin: 14,
      /** echo guard: extra volume needed to START a sound while the game's own sfx are audible
       *  (echoStartBoost until the echo level has been learned, echoKnownBoost afterwards) */
      echoStartBoost: 0.3,
      echoKnownBoost: 0.08,
      /** echo guard fall-off time constant (room reverberation tail, s) */
      echoTailTau: 0.12,
      /** learned echo level: rise / decay time constants (s) and over-subtraction factor */

        var rock = new T.Mesh(new T.DodecahedronGeometry(0.5 + rand(), 0), std(0x1e1614, { flatShading: true }));
        rock.position.set(p.x, p.y + 0.3, p.z); W.add(rock);
      });
      var lavaLight = new T.PointLight(0xff5a1a, 1.2, 40);
      lavaLight.position.set(0, 3, -6); W.add(lavaLight);
    }
  };

  Renderer3D.prototype._tree = function (p, s, color) {
    var T = this.THREE;
    var trunk = new T.Mesh(new T.CylinderGeometry(0.12 * s, 0.16 * s, 1.2 * s, 8), new T.MeshStandardMaterial({ color: 0x7a5230 }));
    trunk.position.set(p.x, p.y + 0.6 * s, p.z);
    var crown = new T.Mesh(new T.SphereGeometry(0.9 * s, 12, 10), new T.MeshStandardMaterial({ color: color, roughness: 0.9 }));
    crown.position.set(p.x, p.y + 1.6 * s, p.z);
    this.world.add(trunk); this.world.add(crown);
  };

  Renderer3D.prototype._pine = function (p, s) {
    var T = this.THREE;
    var trunk = new T.Mesh(new T.CylinderGeometry(0.1 * s, 0.14 * s, 0.8 * s, 6), new T.MeshStandardMaterial({ color: 0x5a3a20 }));
    trunk.position.set(p.x, p.y + 0.4 * s, p.z);
    this.world.add(trunk);
    for (var i = 0; i < 3; i++) {
      var cone = new T.Mesh(new T.ConeGeometry((0.9 - i * 0.22) * s, 1.1 * s, 10), new T.MeshStandardMaterial({ color: i === 2 ? 0xffffff : 0x2f6a4a, roughness: 0.9 }));
      cone.position.set(p.x, p.y + (1 + i * 0.6) * s, p.z);
      this.world.add(cone);
    }
  };

  Renderer3D.prototype._buildAmbientParticles = function (kind) {
    var T = this.THREE;
    var n = 500, arr = new Float32Array(n * 3), rand = seeded(5);
    for (var i = 0; i < n; i++) {
      arr[i * 3] = (rand() - 0.5) * 50; arr[i * 3 + 1] = rand() * 20; arr[i * 3 + 2] = (rand() - 0.5) * 50;
    }
    var geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(arr, 3));
    var pts = new T.Points(geo, new T.PointsMaterial({
      color: kind === 'snow' ? 0xffffff : 0xff7a2a, size: kind === 'snow' ? 0.12 : 0.09,
      transparent: true, opacity: 0.85, depthWrite: false
    }));
    pts.userData.kind = kind;
    this.world.add(pts);
    return pts;
  };

  Renderer3D.prototype._buildZone = function (level) {
    var T = this.THREE, z = level.zone, c = z.center;
    var g = new T.Group();
    g.position.set(c.x, c.y, c.z);
    var shellMat = new T.MeshBasicMaterial({ color: 0x5fd7ff, transparent: true, opacity: 0.1, depthWrite: false });
    var shell = new T.Mesh(new T.SphereGeometry(z.radius, 40, 24), shellMat);
    var wireMat = new T.MeshBasicMaterial({ color: 0x5fd7ff, wireframe: true, transparent: true, opacity: 0.18, depthWrite: false });
    var wire = new T.Mesh(new T.SphereGeometry(z.radius, 16, 10), wireMat);
    g.add(shell); g.add(wire);

    var ringGroup = new T.Group();
    var minRing = new T.Mesh(new T.TorusGeometry(level.target.minRadius, 0.025, 8, 64), new T.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.85 }));
    var maxRing = new T.Mesh(new T.TorusGeometry(level.target.maxRadius, 0.035, 8, 64), new T.MeshBasicMaterial({ color: 0xff7aa8, transparent: true, opacity: 0.85 }));
    ringGroup.add(minRing); ringGroup.add(maxRing);
    g.add(ringGroup);
    this.world.add(g);

    var groundY = terrainHeight(c.x, c.z, this.theme.hills) + 0.12;
    var ground = new T.Mesh(new T.RingGeometry(z.radius * 0.85, z.radius, 48), new T.MeshBasicMaterial({ color: 0x5fd7ff, transparent: true, opacity: 0.55, side: T.DoubleSide, depthWrite: false }));
    ground.rotation.x = -Math.PI / 2; ground.position.set(c.x, groundY, c.z);
    this.world.add(ground);
    var beamH = Math.max(0.01, c.y - z.radius - groundY);
    var beam = new T.Mesh(new T.CylinderGeometry(0.04, 0.04, beamH, 6), new T.MeshBasicMaterial({ color: 0x5fd7ff, transparent: true, opacity: 0.35 }));
    beam.position.set(c.x, groundY + beamH / 2, c.z);
    this.world.add(beam);

    this.zone = { group: g, shellMat: shellMat, wireMat: wireMat, ringGroup: ringGroup, groundMat: ground.material, beamMat: beam.material };
  };

  Renderer3D.prototype.resetBubble = function () {
    var s = config.spawn;
    this.bubbleMode = 'alive';
    this.displayRadius = config.bubble.startRadius;
    this.bubble.visible = true;
    this.bubble.position.set(s.x, s.y, s.z);
    this.bubble.scale.setScalar(this.displayRadius);
    var u = this.bubbleUniforms;
    u.uOpacity.value = 1; u.uGlow.value = 0; u.uStress.value = 0; u.uWobble.value = 0;
  };

  /* ---------------- effects ---------------- */

  Renderer3D.prototype._particleBurst = function (pos, count, opts) {
    var T = this.THREE;
    var positions = new Float32Array(count * 3), colors = new Float32Array(count * 3), vel = [];
    var col = new T.Color();
    for (var i = 0; i < count; i++) {
      var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      var dir = { x: s * Math.cos(th), y: u, z: s * Math.sin(th) };
      var r0 = opts.radius || 0;
      positions[i * 3] = pos.x + dir.x * r0; positions[i * 3 + 1] = pos.y + dir.y * r0; positions[i * 3 + 2] = pos.z + dir.z * r0;
      var sp = opts.speed * (0.5 + Math.random());
      vel.push({ x: dir.x * sp, y: dir.y * sp + (opts.up || 0), z: dir.z * sp });
      col.setHSL(opts.hue !== undefined ? opts.hue + Math.random() * 0.1 : Math.random(), 0.9, 0.7);
      colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
    }
    var geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(positions, 3));
    geo.setAttribute('color', new T.BufferAttribute(colors, 3));
    var mat = new T.PointsMaterial({ size: opts.size || 0.1, vertexColors: true, transparent: true, opacity: 1, depthWrite: false });
    var pts = new T.Points(geo, mat);
    this.scene.add(pts);
    var life = 0, scene = this.scene;
    this.effects.push({
      update: function (dt) {
        life += dt;
        var p = geo.attributes.position.array;
        for (var i = 0; i < vel.length; i++) {
          vel[i].y -= (opts.gravity || 0) * dt;
          var drag = Math.exp(-(opts.drag || 0.5) * dt);
          vel[i].x *= drag; vel[i].y *= drag; vel[i].z *= drag;
          p[i * 3] += vel[i].x * dt; p[i * 3 + 1] += vel[i].y * dt; p[i * 3 + 2] += vel[i].z * dt;
        }
        geo.attributes.position.needsUpdate = true;
        mat.opacity = Math.max(0, 1 - life / opts.life);
        return life < opts.life;
      },
      dispose: function () { scene.remove(pts); geo.dispose(); mat.dispose(); }
    });
  };

  Renderer3D.prototype._shockwave = function (pos, radius) {
    var T = this.THREE;
    var mesh = new T.Mesh(new T.SphereGeometry(1, 20, 14), new T.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.6, depthWrite: false }));
    mesh.position.set(pos.x, pos.y, pos.z);
    mesh.scale.setScalar(radius);
    this.scene.add(mesh);
    var life = 0, scene = this.scene;
    this.effects.push({
      update: function (dt) { life += dt; mesh.scale.setScalar(radius * (1 + life * 5)); mesh.material.opacity = Math.max(0, 0.6 - life * 2); return life < 0.3; },
      dispose: function () { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
    });
  };

  Renderer3D.prototype.clearEffects = function () {
    this.effects.forEach(function (e) { e.dispose(); });
    this.effects = [];
  };

  /** React to game events (burst / escape / pass / detach) */
  Renderer3D.prototype.onEvent = function (evt, payload) {
    var p = payload && payload.pos;
    if (evt === 'burst') {
      this.bubbleMode = 'burst';
      this.bubble.visible = false;
      this._particleBurst(p, 220, { radius: payload.radius, speed: 2.4, gravity: 4, life: 1.1, size: 0.08 });
      this._shockwave(p, payload.radius);
    } else if (evt === 'escape') {
      this.bubbleMode = 'escape';
      var v = payload.vel || { x: 0, y: 1, z: 0 };
      var l = Math.max(0.5, Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z));
      this.escapeVel = { x: v.x / l * 4, y: v.y / l * 4 + 2, z: v.z / l * 4 };
      this.escapeTime = 0;
    } else if (evt === 'pass') {
      this.bubbleMode = 'pass';
      var c = this.level.zone.center;
      this._particleBurst(c, 260, { speed: 4, up: 3, gravity: 5, life: 2.2, size: 0.13, drag: 0.8 });
    } else if (evt === 'detach') {
      this._particleBurst(p, 30, { speed: 0.8, gravity: 1, life: 0.6, size: 0.05, hue: 0.55 });
    }
  };

  /**
   * Per-frame update.
   * @param {object} snap GameEngine snapshot (may be null before the first level)
   * @param {number} dt
   */
  Renderer3D.prototype.update = function (snap, dt) {
    this.time += dt;
    var u = this.bubbleUniforms;
    u.uTime.value = this.time;

    if (snap && this.level) {
      var b = snap.bubble;
      if (this.bubbleMode === 'alive') {
        this.displayRadius += (b.radius - this.displayRadius) * U.smoothing(dt, 0.05);
        this.bubble.position.set(b.pos.x, b.pos.y, b.pos.z);
        this.bubble.scale.setScalar(this.displayRadius);
        u.uStress.value = b.stress;
        u.uWobble.value = snap.audio ? snap.audio.volume : 0;
      } else if (this.bubbleMode === 'escape') {
        this.escapeTime += dt;
        var bp = this.bubble.position;
        bp.x += this.escapeVel.x * dt; bp.y += this.escapeVel.y * dt; bp.z += this.escapeVel.z * dt;
        this.escapeVel.y += 1.5 * dt;
        u.uOpacity.value = Math.max(0, 1 - this.escapeTime / 1.6);
        if (u.uOpacity.value <= 0) this.bubble.visible = false;
      } else if (this.bubbleMode === 'pass') {
        u.uGlow.value = Math.min(1, u.uGlow.value + dt * 1.5);
        this.bubble.position.y += dt * 0.6;
      }

      var e = snap.eval || {};
      var zc = (e.inZone && e.sizeOk) ? 0x4dff88 : e.inZone ? 0xffd34d : 0x5fd7ff;
      var pulse = 0.5 + 0.5 * Math.sin(this.time * ((e.inZone && e.sizeOk) ? 8 : 2.5));
      this.zone.shellMat.color.set(zc); this.zone.wireMat.color.set(zc);
      this.zone.groundMat.color.set(zc); this.zone.beamMat.color.set(zc);
      this.zone.shellMat.opacity = 0.07 + 0.08 * pulse + (e.holdProgress || 0) * 0.12;
      this.zone.ringGroup.lookAt(this.camera.position);

      var visible = this.bubble.visible;
      var bpos = this.bubble.position;
      var gy = terrainHeight(bpos.x, bpos.z, this.theme.hills) + 0.07;
      this.shadow.visible = visible;
      this.shadow.position.set(bpos.x, gy, bpos.z);
      this.shadow.scale.setScalar(Math.max(0.05, this.displayRadius * (1 - Math.min(0.6, (bpos.y - gy) * 0.06))));
      this.shadow.material.opacity = 0.22 * Math.max(0.2, 1 - (bpos.y - gy) * 0.08) * u.uOpacity.value;
      var lp = this.heightLine.geometry.attributes.position;
      lp.setXYZ(0, bpos.x, gy, bpos.z); lp.setXYZ(1, bpos.x, bpos.y - this.displayRadius, bpos.z);
      lp.needsUpdate = true;
      this.heightLine.visible = visible && this.bubbleMode === 'alive';
    }

    if (this.particles) {
      var arr = this.particles.geometry.attributes.position.array;
      var snow = this.particles.userData.kind === 'snow';
      for (var i = 0; i < arr.length; i += 3) {
        arr[i + 1] += (snow ? -0.8 : 1.1) * dt;
        arr[i] += Math.sin(this.time + i) * 0.2 * dt;
        if (snow && arr[i + 1] < 0) arr[i + 1] = 20;
        if (!snow && arr[i + 1] > 20) arr[i + 1] = 0;
      }
      this.particles.geometry.attributes.position.needsUpdate = true;
    }

    this.wand.lookAt(this.camera.position.x, this.wand.position.y, this.camera.position.z);

    for (var k = this.effects.length - 1; k >= 0; k--) {
      if (!this.effects[k].update(dt)) { this.effects[k].dispose(); this.effects.splice(k, 1); }
    }
    this.renderer.render(this.scene, this.camera);
  };

  Renderer3D.prototype.resize = function () {
    var w = this.container.clientWidth || 1, h = this.container.clientHeight || 1;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    // keep the arena in view on narrow (portrait) screens
    this.camera.fov = w / h < 0.8 ? 68 : 50;
    this.camera.updateProjectionMatrix();
  };

  return { Renderer3D: Renderer3D, THEMES: THEMES, terrainHeight: terrainHeight };
});

</script>
  <script>
/* js/app.js */
/**
 * RoarBubbles - browser application: wires mic → engine → renderer / sound / HUD.
 */
(function (root) {
  'use strict';
  var RB = root.RB;
  var doc = root.document;
  if (!doc) return;

  var t = RB.i18n.t;
  var $ = function (id) { return doc.getElementById(id); };

  var storage = RB.utils.createStorage();
  var KEY = RB.config.storageKey;
  var engine = new RB.gameEngine.GameEngine({ storage: storage });
  var sfx = new RB.sfx.Sfx({ storage: storage });
  var mic = new RB.micInput.MicInput();
  var renderer = null;

  var app = {
    phase: 'brief', // brief | countdown | playing | result
    countdown: 0,
    lastCount: -1,
    hintKey: '',
    hintTimer: 0,
    resultTimer: null,
    lastResult: null
  };

  /* ---------------- settings ---------------- */
  var settings = storage.get(KEY + '.settings', null) || {};
  RB.i18n.setLang(settings.lang || RB.i18n.detect());
  engine.analyzer.setSensitivity(settings.sensitivity || 1);
  function saveSettings() { storage.set(KEY + '.settings', settings); }

  /* ---------------- i18n ---------------- */
  function applyI18n() {
    doc.documentElement.lang = RB.i18n.getLang() === 'zh' ? 'zh-CN' : 'en';
    doc.title = t('title') + ' · RoarBubbles';
    Array.prototype.forEach.call(doc.querySelectorAll('[data-i18n]'), function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    Array.prototype.forEach.call(doc.querySelectorAll('[data-i18n-title]'), function (el) {
      var s = t(el.getAttribute('data-i18n-title'));
      el.title = s; el.setAttribute('aria-label', s);
    });
    $('guide-body').innerHTML = t('guide_html');
    Array.prototype.forEach.call(doc.querySelectorAll('#lang-switch [data-lang]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === RB.i18n.getLang()));
    });
    updateSoundButton();
    renderLevelHeader();
    if (app.phase === 'brief') renderBrief();
    if (app.phase === 'result' && app.lastResult) showResult(app.lastResult);
    if (app.hintKey) $('hint').textContent = t(app.hintKey);
    renderLevelGrid();
  }

  function levelName(level) { return level.name[RB.i18n.getLang()] || level.name.zh; }

  function renderLevelHeader() {
    if (!engine.level) return;
    $('level-label').textContent = t('level', { n: engine.level.id }) + ' · ' + levelName(engine.level);
  }

  /* ---------------- modals / overlays ---------------- */
  function show(id) { $(id).hidden = false; }
  function hide(id) { $(id).hidden = true; }
  function openModal(id) { sfx.play('click'); show(id); }

  function difficultyStars(d) {
    var n = Math.max(1, Math.round(1 + d * 4));
    return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
  }

  function renderBrief() {
    var L = engine.level;
    if (!L) return;
    $('brief-title').textContent = t('level', { n: L.id }) + ' · ' + levelName(L);
    $('brief-difficulty').textContent = t('brief_difficulty') + ' ' + difficultyStars(L.difficulty);
    $('brief-goals').innerHTML =
      '<li>📏 ' + t('brief_size', { min: L.target.minRadius.toFixed(2), max: L.target.maxRadius.toFixed(2) }) + '</li>' +
      '<li>🎯 ' + t('brief_zone') + '</li>' +
      '<li>⏱ ' + t('brief_hold', { hold: L.holdTime }) + '</li>' +
      '<li>⌛ ' + t('brief_time', { time: L.timeLimit }) + '</li>';
    $('brief-error').textContent = '';
    $('brief-countdown').textContent = '';
    $('btn-start').disabled = false;
  }

  function renderLevelGrid() {
    var grid = $('level-grid');
    grid.innerHTML = '';
    engine.levels.forEach(function (L, i) {
      var b = doc.createElement('button');
      var unlocked = engine.isUnlocked(i);
      var stars = engine.progress.stars[String(L.id)] || 0;
      b.className = 'level-btn theme-' + L.theme + (i === engine.levelIndex ? ' current' : '');
      b.disabled = !unlocked;
      b.innerHTML = '<span class="num">' + L.id + '</span><span class="nm">' + (unlocked ? levelName(L) : '🔒 ' + t('locked')) +
        '</span><span class="st">' + '★★★'.slice(0, stars) + '<i>' + '☆☆☆'.slice(0, 3 - stars) + '</i></span>';
      b.addEventListener('click', function () { hide('modal-levels'); loadLevel(i); });
      grid.appendChild(b);
    });
  }

  function loadLevel(i) {
    clearTimeout(app.resultTimer);
    engine.loadLevel(i);
    if (renderer) renderer.setLevel(engine.level);
    app.phase = 'brief';
    hide('overlay-result');
    renderLevelHeader();
    renderBrief();
    renderLevelGrid();
    show('overlay-brief');
    setHint('tip_start');
  }

  function startLevel() {
    sfx.ensure();
    $('btn-start').disabled = true;
    $('brief-error').textContent = '';
    mic.start().then(function () {
      app.phase = 'countdown';
      app.countdown = 2.4;
      app.lastCount = -1;
      $('brief-countdown').textContent = t('calibrating');
    }).catch(function (err) {
      var key = RB.micInput.MicInput.errorKey(err);
      $('brief-error').textContent = t(key, { msg: (err && (err.message || err.name)) || '?' });
      $('btn-start').disabled = false;
    });
  }

  function showResult(res) {
    var L = engine.level;
    app.lastResult = res;
    app.phase = 'result';
    var box = $('overlay-result');
    box.classList.toggle('win', res.passed);
    box.classList.toggle('lose', !res.passed);
    $('result-title').textContent = res.passed ? t('passed') : t('failed');
    $('result-stars').textContent = res.passed ? '★★★'.slice(0, res.stars) + '☆☆☆'.slice(0, 3 - res.stars) : '';
    var msg = res.passed ? t('time_used', { t: res.elapsed.toFixed(1) }) : t('fail_' + res.reason);
    if (res.passed && !engine.hasNext()) msg += ' 🎉 ' + t('all_cleared');
    $('result-msg').textContent = msg;
    $('btn-next').hidden = !(res.passed && engine.hasNext());
    $('result-title').setAttribute('data-level', L ? L.id : '');
    show('overlay-result');
  }

  /* ---------------- HUD ---------------- */
  function setMeter(id, v) { $(id).style.width = (RB.utils.clamp01(v) * 100).toFixed(1) + '%'; }

  function setHint(key) {
    if (key === app.hintKey) return;
    app.hintKey = key;
    app.hintTimer = 0;
    $('hint').textContent = t(key);
  }

  function updateHud(snap, dt) {
    var a = snap.audio, b = snap.bubble, e = snap.eval || {}, L = engine.level;
    setMeter('m-volume', a.volume);
    setMeter('m-continuity', a.continuity);
    setMeter('m-rhythm', a.rhythm);
    setMeter('m-stress', b.stress);
    $('m-bpm').textContent = a.bpm ? Math.round(a.bpm) + ' bpm' : '';
    if (!L) return;

    var scaleMax = L.physics.burstRadius * (1 + RB.config.bubble.rhythmBurstBonus);
    var pct = function (r) { return (RB.utils.clamp01(r / scaleMax) * 100).toFixed(1) + '%'; };
    $('size-band').style.left = pct(L.target.minRadius);
    $('size-band').style.width = ((L.target.maxRadius - L.target.minRadius) / scaleMax * 100).toFixed(1) + '%';
    $('size-burst').style.left = pct(b.burstRadius || L.physics.burstRadius);
    $('size-marker').style.left = pct(b.radius);
    $('size-value').textContent = b.radius.toFixed(2) + ' / ' + L.target.minRadius.toFixed(2) + '–' + L.target.maxRadius.toFixed(2);
    $('chk-size').classList.toggle('ok', !!e.sizeOk);
    $('chk-zone').classList.toggle('ok', !!e.inZone);
    setMeter('hold-bar', e.holdProgress || 0);
    $('hold-value').textContent = (e.hold || 0).toFixed(1) + ' / ' + L.holdTime + t('seconds');
    var rem = e.remaining !== undefined ? e.remaining : L.timeLimit;
    $('time-value').textContent = Math.ceil(rem) + t('seconds');
    $('time-value').classList.toggle('warn', rem < 10);

    app.hintTimer += dt;
    var key = RB.hints.pickHint(snap, L);
    if (key !== app.hintKey && app.hintTimer > 0.7) setHint(key);
  }

  /* ---------------- engine events ---------------- */
  engine.on('grow', function (p) { sfx.play('grow', p); });
  engine.on('shrink', function (p) { sfx.play('shrink', p); });
  engine.on('detach', function (p) { sfx.play('detach'); if (renderer) renderer.onEvent('detach', p); });
  engine.on('enterZone', function () { sfx.play('enterZone'); });
  engine.on('leaveZone', function () { sfx.play('leaveZone'); });
  engine.on('burst', function (p) { sfx.play('burst'); if (renderer) renderer.onEvent('burst', p); });
  engine.on('escape', function (p) { sfx.play('escape'); if (renderer) renderer.onEvent('escape', p); });
  engine.on('pass', function (res) {
    sfx.play('pass');
    if (renderer) renderer.onEvent('pass', {});
    app.resultTimer = setTimeout(function () { showResult(res); renderLevelGrid(); }, 1400);
  });
  engine.on('fail', function (res) {
    app.resultTimer = setTimeout(function () { sfx.play('fail'); showResult(res); }, res.reason === 'escaped' ? 1500 : 1000);
  });

  /* ---------------- main loop ---------------- */
  var last = 0;
  function frame(now) {
    // real elapsed time (capped so a background tab does not jump); slow devices still run in real time
    var dt = last ? Math.min(0.1, Math.max(0, (now - last) / 1000)) : 1 / 60;
    last = now;
    var samples = mic.read();
    // our own sound effects reach the microphone through the speakers: never treat them as the player
    var echo = sfx.isAudible();

    if (app.phase === 'countdown') {
      // calibrate on room noise only (skip the countdown beeps)
      if (samples && !echo) engine.analyzer.observeAmbient(RB.audioAnalyzer.computeRms(samples), dt);
      app.countdown -= dt;
      var n = Math.ceil(app.countdown / 0.8);
      if (n !== app.lastCount && n > 0) {
        app.lastCount = n;
        $('brief-countdown').textContent = t('calibrating') + '  ' + n;
        sfx.play('countdown', { final: false });
      }
      if (app.countdown <= 0) {
        sfx.play('countdown', { final: true });
        hide('overlay-brief');
        flash(t('go'));
        engine.start();
        app.phase = 'playing';
      }
    } else if (app.phase === 'playing' && samples) {
      engine.analyzer.setEchoGuard(echo ? 1 : 0, dt);
      engine.update(samples, dt);
    }

    var snap = engine.snapshot();
    if (renderer) renderer.update(snap, dt);
    updateHud(snap, dt);
    root.requestAnimationFrame(frame);
  }

  function flash(text) {
    var el = $('flash');
    el.textContent = text;
    el.classList.remove('show');
    void el.offsetWidth; // restart CSS animation
    el.classList.add('show');
  }

  /* ---------------- controls ---------------- */
  function updateSoundButton() {
    var b = $('btn-sound');
    b.textContent = sfx.enabled ? '🔊' : '🔇';
    b.title = sfx.enabled ? t('sound_on') : t('sound_off');
    b.setAttribute('aria-label', b.title);
    b.setAttribute('aria-pressed', String(sfx.enabled));
  }

  function bind() {
    $('btn-guide').addEventListener('click', function () { openModal('modal-guide'); });
    $('btn-levels').addEventListener('click', function () { renderLevelGrid(); openModal('modal-levels'); });
    $('btn-settings').addEventListener('click', function () { openModal('modal-settings'); });
    $('btn-sound').addEventListener('click', function () { sfx.toggle(); updateSoundButton(); sfx.play('click'); });
    Array.prototype.forEach.call(doc.querySelectorAll('#lang-switch [data-lang]'), function (b) {
      b.addEventListener('click', function () {
        var lang = b.getAttribute('data-lang');
        if (lang === RB.i18n.getLang()) return;
        settings.lang = RB.i18n.setLang(lang);
        saveSettings(); applyI18n(); sfx.play('click');
      });
    });
    $('btn-view').addEventListener('click', function () { if (renderer) renderer.orbit.reset(); sfx.play('click'); });
    $('btn-start').addEventListener('click', startLevel);
    $('btn-retry').addEventListener('click', function () { loadLevel(engine.levelIndex); });
    $('btn-next').addEventListener('click', function () { loadLevel(engine.levelIndex + 1); });
    $('btn-menu').addEventListener('click', function () { renderLevelGrid(); show('modal-levels'); });
    Array.prototype.forEach.call(doc.querySelectorAll('[data-close]'), function (el) {
      el.addEventListener('click', function () { hide(el.getAttribute('data-close')); });
    });
    Array.prototype.forEach.call(doc.querySelectorAll('.modal'), function (m) {
      m.addEventListener('click', function (e) { if (e.target === m) m.hidden = true; });
    });
    doc.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') Array.prototype.forEach.call(doc.querySelectorAll('.modal'), function (m) { m.hidden = true; });
    });

    var sens = $('in-sensitivity');
    sens.value = settings.sensitivity || 1;
    $('out-sensitivity').textContent = Number(sens.value).toFixed(1) + '×';
    sens.addEventListener('input', function () {
      settings.sensitivity = Number(sens.value);
      engine.analyzer.setSensitivity(settings.sensitivity);
      $('out-sensitivity').textContent = settings.sensitivity.toFixed(1) + '×';
      saveSettings();
    });
    var vol = $('in-volume');
    vol.value = sfx.volume;
    vol.addEventListener('input', function () { sfx.setVolume(vol.value); });
    vol.addEventListener('change', function () { sfx.play('pass'); });
    $('btn-reset-progress').addEventListener('click', function () {
      engine.resetProgress(); renderLevelGrid(); $('reset-msg').textContent = t('reset_done');
    });

    doc.addEventListener('pointerdown', function () { sfx.ensure(); mic.resume(); }, { once: true });
    root.addEventListener('resize', function () { if (renderer) renderer.resize(); });
    doc.addEventListener('visibilitychange', function () { if (!doc.hidden) { mic.resume(); last = 0; } });
  }

  function boot() {
    try {
      renderer = new RB.renderer3d.Renderer3D($('stage'), root.THREE);
    } catch (e) {
      renderer = null;
      $('fatal').textContent = t('webgl_error') + ' (' + e.message + ')';
      $('fatal').hidden = false;
    }
    bind();
    applyI18n();
    loadLevel(Math.min(engine.progress.unlocked, engine.levels.length) - 1);
    if (!storage.get(KEY + '.guideSeen', false)) { show('modal-guide'); storage.set(KEY + '.guideSeen', true); }
    root.requestAnimationFrame(frame);
    root.RoarBubbles = { engine: engine, sfx: sfx, mic: mic, renderer: renderer, loadLevel: loadLevel, RB: RB };
  }

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof self !== 'undefined' ? self : this);

</script>
</body>
</html>
